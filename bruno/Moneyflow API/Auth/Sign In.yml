info:
  name: Sign In
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/auth/signin"
  body:
    type: json
    data: |-
      {
        "email": "{{EMAIL}}",
        "password": "{{PWD}}",
        "deviceLabel": "API Client"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body.success && res.body.data) {
          const { token, refreshToken } = res.body.data;

          if (token) bru.setEnvVar("AUTH_TOKEN", token);
          if (refreshToken) bru.setEnvVar("REFRESH_TOKEN", refreshToken);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
