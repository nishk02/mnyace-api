info:
  name: Create Account
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/api/accounts"
  body:
    type: json
    data: |-
      {
        "type": "BANK",
        "bankCode": "AXIS",
        "currentBalance": 35000.00,
        "accountSuffix": "3388",
        "cardSuffixes": ["8155"]
      }
  auth:
    type: bearer
    token: "{{AUTH_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
