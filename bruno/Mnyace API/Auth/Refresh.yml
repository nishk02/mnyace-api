info:
  name: Refresh
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{REFRESH_TOKEN}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // The presented refresh token is spent, so keep the rotated one or the next call reads as reuse.
        if (res.body.success && res.body.data) {
          const { token, refreshToken } = res.body.data;

          if (token) bru.setEnvVar("AUTH_TOKEN", token);
          if (refreshToken) bru.setEnvVar("REFRESH_TOKEN", refreshToken);

          bru.setVar("SESSION_RESTRICTED", String(!!res.body.data.sessionRestricted));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
