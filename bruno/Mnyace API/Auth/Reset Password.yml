info:
  name: Reset Password
  type: http
  seq: 10

http:
  method: POST
  url: "{{BASE_URL}}/auth/reset-password"
  body:
    type: json
    data: |-
      {
        "email": "{{EMAIL}}",
        "code": "{{RESET_CODE}}",
        "newPassword": "{{NEW_PWD}}",
        "confirmNewPassword": "{{NEW_PWD}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
