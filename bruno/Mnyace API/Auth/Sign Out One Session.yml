info:
  name: Sign Out One Session
  type: http
  seq: 8

http:
  method: DELETE
  url: "{{BASE_URL}}/api/sessions/{{SESSION_ID}}"
  auth:
    type: bearer
    token: "{{AUTH_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
