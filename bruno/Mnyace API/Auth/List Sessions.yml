info:
  name: List Sessions
  type: http
  seq: 7

http:
  method: GET
  url: "{{BASE_URL}}/api/sessions"
  auth:
    type: bearer
    token: "{{AUTH_TOKEN}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        // Kept in memory only (a runtime variable), so it never lands in an environment file.
        const other = (res.body.data || []).find((s) => !s.current);
        bru.setVar("SESSION_ID", other ? other.id : "");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
