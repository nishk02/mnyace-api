info:
  name: List Sessions
  type: http
  seq: 7

http:
  method: GET
  url: "{{BASE_URL}}/api/sessions"
  auth:
    type: bearer
    token: "{{AUTH_TOKEN}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        // Kept in memory only (a runtime variable), so it never lands in an environment file.
        const sessions = res.body.data || [];
        const other = sessions.find((s) => !s.current);
        bru.setVar("SESSION_ID", other ? other.id : "");

        // Whether the calling session is past the 2-session limit (also returned by sign-in and refresh).
        const me = sessions.find((s) => s.current);
        bru.setEnvVar("SESSION_RESTRICTED", me ? String(me.restricted) : "");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
