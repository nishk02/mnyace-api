info:
  name: Logout
  type: http
  seq: 4

http:
  method: POST
  url: "{{BASE_URL}}/auth/logout"
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{REFRESH_TOKEN}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
