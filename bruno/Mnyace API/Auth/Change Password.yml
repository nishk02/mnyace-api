info:
  name: Change Password
  type: http
  seq: 5

http:
  method: PUT
  url: "{{BASE_URL}}/api/users/me/password"
  headers:
    - name: X-Client-Platform
      value: web
      disabled: true
  body:
    type: json
    data: |-
      {
        "currentPassword": "{{PWD}}",
        "newPassword": "{{NEW_PWD}}",
        "confirmNewPassword": "{{NEW_PWD}}",
        "deviceLabel": "API Client"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Success signs every other device out and returns a fresh session for this one.
        if (res.status === 200 && res.body.success && res.body.data) {
          const { token, refreshToken } = res.body.data;

          if (token) bru.setEnvVar("AUTH_TOKEN", token);
          if (refreshToken) bru.setEnvVar("REFRESH_TOKEN", refreshToken);
          bru.setEnvVar("PWD", bru.getEnvVar("NEW_PWD"));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
