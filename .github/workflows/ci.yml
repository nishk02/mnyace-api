name: CI

# Runs on every pull request into main, and is called by the CD workflow before a deploy.
on:
  pull_request:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read

# Cancel an in-flight run for the same branch when a new commit lands. The event is part
# of the group name so a call from the CD workflow never shares a group with its caller.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Stage 1: compile + run tests --------------------------------------
  # This is the same "does the code even work" gate NestJS's `npm run
  # build && npm test` would give you - just via Maven instead of npm.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven # caches ~/.m2 keyed on pom.xml, same idea as caching node_modules on package-lock.json

      - name: Guard - the api container must never be published to the host
        # RateLimitFilter trusts X-Forwarded-For because only Caddy can reach the api
        # container (docker-compose `expose`, never `ports`). Publishing it would let anyone
        # forge their IP and walk around the limiter.
        run: |
          if awk '/^  api:/{f=1;next} /^  [a-z-]+:/{f=0} f && /^    ports:/{found=1} END{exit !found}' docker-compose.yml; then
            echo "docker-compose.yml publishes ports on the api service" >&2
            exit 1
          fi

      - name: Validate the log shipper config
        # Image version is read from the compose file, so CI always checks what runs in prod.
        run: |
          IMG=$(awk '/image: fluent\/fluent-bit:/{print $2}' docker-compose.yml)
          docker run --rm --entrypoint /fluent-bit/bin/fluent-bit \
            -e AXIOM_HOST=example.invalid -e AXIOM_DATASET=check -e AXIOM_TOKEN=check \
            -v "$PWD/fluent-bit:/fluent-bit/etc:ro" \
            "$IMG" -c /fluent-bit/etc/fluent-bit.yaml --dry-run

      - name: Build and test
        run: ./mvnw -B clean verify
        # No src/test yet, so this is effectively a compile check today.
        # The moment real tests exist, this same command starts running
        # them - nothing here needs to change.
