name: CI/CD

# Every push runs build+test+scan (fast feedback on any branch). The image
# build and deploy jobs only run on main - a feature branch has no business
# reaching production.
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

# Cancel an in-flight run for the same branch if a new commit lands - no
# point finishing a build for code that's already been superseded.
# Least privilege; the image job adds packages: write itself.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # --- Stage 1: compile + run tests --------------------------------------
  # This is the same "does the code even work" gate NestJS's `npm run
  # build && npm test` would give you - just via Maven instead of npm.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven # caches ~/.m2 keyed on pom.xml, same idea as caching node_modules on package-lock.json

      - name: Guard - the api container must never be published to the host
        # RateLimitFilter trusts X-Forwarded-For because only Caddy can reach the api
        # container (docker-compose `expose`, never `ports`). Publishing it would let anyone
        # forge their IP and walk around the limiter.
        run: |
          if awk '/^  api:/{f=1;next} /^  [a-z-]+:/{f=0} f && /^    ports:/{found=1} END{exit !found}' docker-compose.yml; then
            echo "docker-compose.yml publishes ports on the api service" >&2
            exit 1
          fi

      - name: Build and test
        run: ./mvnw -B clean verify
        # No src/test yet, so this is effectively a compile check today.
        # The moment real tests exist, this same command starts running
        # them - nothing here needs to change.

  # --- Stage 2: build the image, scan it, push it if clean ---------------
  build-scan-push:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets this job push to ghcr.io using the built-in GITHUB_TOKEN - no extra secret to create
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (not pushed yet - scan it first)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true # makes the image available to `docker` on this runner so Trivy below can scan it
          tags: ${{ env.IMAGE }}:scan

      - name: Scan image for known CVEs (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1" # fail the job if anything CRITICAL/HIGH turns up - same instinct as failing a build on a lint error
          trivyignores: .trivyignore

      - name: Push image (only reached if the scan passed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  # --- Stage 3: deploy the new image to the Lightsail VM ------------------
  deploy:
    needs: build-scan-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Copy compose + Caddy + Litestream config to the VM
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "docker-compose.yml,Caddyfile,litestream.yml"
          target: ~/mnyace-deploy

      - name: SSH in and roll the containers over
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          API_DOMAIN: ${{ secrets.API_DOMAIN }}
          LITESTREAM_BUCKET: ${{ secrets.LITESTREAM_BUCKET }}
          LITESTREAM_ENDPOINT: ${{ secrets.LITESTREAM_ENDPOINT }}
          LITESTREAM_ACCESS_KEY_ID: ${{ secrets.LITESTREAM_ACCESS_KEY_ID }}
          LITESTREAM_SECRET_ACCESS_KEY: ${{ secrets.LITESTREAM_SECRET_ACCESS_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          INVITE_SIGNUP_URL: ${{ secrets.INVITE_SIGNUP_URL }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: JWT_SECRET,API_DOMAIN,LITESTREAM_BUCKET,LITESTREAM_ENDPOINT,LITESTREAM_ACCESS_KEY_ID,LITESTREAM_SECRET_ACCESS_KEY,ADMIN_EMAIL,ADMIN_PASSWORD,MAIL_HOST,MAIL_USERNAME,MAIL_PASSWORD,MAIL_FROM,INVITE_SIGNUP_URL
          script: |
            cd ~/mnyace-deploy
            set -e
            umask 077 # .env is created owner-only, never briefly world-readable
            echo "JWT_SECRET=${JWT_SECRET}" > .env
            echo "API_DOMAIN=${API_DOMAIN}" >> .env
            echo "LITESTREAM_BUCKET=${LITESTREAM_BUCKET}" >> .env
            echo "LITESTREAM_ENDPOINT=${LITESTREAM_ENDPOINT}" >> .env
            echo "LITESTREAM_ACCESS_KEY_ID=${LITESTREAM_ACCESS_KEY_ID}" >> .env
            echo "LITESTREAM_SECRET_ACCESS_KEY=${LITESTREAM_SECRET_ACCESS_KEY}" >> .env
            echo "ADMIN_EMAIL=${ADMIN_EMAIL}" >> .env
            echo "ADMIN_PASSWORD=${ADMIN_PASSWORD}" >> .env
            echo "MAIL_HOST=${MAIL_HOST}" >> .env
            echo "MAIL_USERNAME=${MAIL_USERNAME}" >> .env
            echo "MAIL_PASSWORD=${MAIL_PASSWORD}" >> .env
            echo "MAIL_FROM=${MAIL_FROM}" >> .env
            echo "INVITE_SIGNUP_URL=${INVITE_SIGNUP_URL}" >> .env
            chmod 600 .env
            docker compose pull
            docker compose up -d
            # Config is read at startup only: restart a service when its file changed.
            # Restart, not reload, since the mount keeps the old file; Caddy's is validated first.
            if [ "$(sha256sum < Caddyfile)" != "$(cat .caddyfile.sha 2>/dev/null)" ]; then
              docker compose run --rm --no-deps -T caddy caddy validate --config /etc/caddy/Caddyfile
              docker compose restart caddy
              sha256sum < Caddyfile > .caddyfile.sha
            fi
            if [ "$(sha256sum < litestream.yml)" != "$(cat .litestream.sha 2>/dev/null)" ]; then
              docker compose restart litestream
              sha256sum < litestream.yml > .litestream.sha
            fi
            docker image prune -f
