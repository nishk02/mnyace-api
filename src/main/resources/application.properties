spring.application.name=mnyace-api

# Server
server.port=8080

# SQLite Database
spring.datasource.url=jdbc:sqlite:mnyace.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Largest page a client may request (the controller default is 100)
spring.data.web.pageable.max-page-size=200

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Profiles
spring.profiles.active=dev

# JWT
jwt.secret=${JWT_SECRET:mnyace-local-dev-secret-key-2026-not-for-prod}
jwt.expiration-ms=900000

# Refresh token
refresh-token.expiration-days=30
# A session ends this long after the original sign-in, however often it refreshes
refresh-token.max-session-days=90
# Daily at 03:30 IST, delete tokens expired more than 7 days ago
refresh-token.cleanup.cron=0 30 3 * * *
refresh-token.cleanup.retention-days=7
# Revoked tokens kept per session for reuse detection; older ones are pruned on each refresh
refresh-token.keep-revoked-per-session=3

# The oldest N sign-ins per user are active; a newer one can only manage sessions until an older one signs out
session.max-per-user=2
# A session's last-active time is written at most once per this many seconds
session.last-active-throttle-seconds=60

# CORS
cors.allowed-origins=capacitor://localhost,ionic://localhost

# Rate limiting (Bucket4j + Caffeine)
rate-limit.signin.ip.capacity=5
rate-limit.signin.ip.period-seconds=60
rate-limit.signin.email.capacity=10
rate-limit.signin.email.period-seconds=900
rate-limit.refresh.ip.capacity=20
rate-limit.refresh.ip.period-seconds=60
rate-limit.password-change.user.capacity=5
rate-limit.password-change.user.period-seconds=900
rate-limit.invite.ip.capacity=10
rate-limit.invite.ip.period-seconds=60
rate-limit.api.ip.capacity=300
rate-limit.api.ip.period-seconds=60
# GET /api/health has its own bucket, so polling during an update cannot use up the shared /api/** one
rate-limit.health.ip.capacity=120
rate-limit.health.ip.period-seconds=60

# Root Admin User
admin.bootstrap.email=${ADMIN_EMAIL:}
admin.bootstrap.password=${ADMIN_PASSWORD:}
# Shown as the inviter in invite emails; blank falls back to "Admin User"
admin.bootstrap.first-name=${ADMIN_FIRST_NAME:}
admin.bootstrap.last-name=${ADMIN_LAST_NAME:}

# Mail (Brevo SMTP)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Invite sign-up link
app.mail-from=${MAIL_FROM:MnyAce Team <no-reply@mnyace.com>}
app.invite-signup-url=${INVITE_SIGNUP_URL:https://app.mnyace.com/signup}
# Where the email logo and icons are hosted (versioned file names, never overwritten)
app.email-assets-url=${EMAIL_ASSETS_URL:https://app.mnyace.com/assets/email}

# Password reset
# Reset emails share the daily mail quota with invites: 60 of 300 a day is reserved for resets
password-reset.mail.daily-budget=60
password-reset.mail.per-email-daily=3
password-reset.request-cooldown-seconds=60
# Daily at 03:45 IST. Keep at least 2 days: the daily mail budget is counted from these rows
password-reset.cleanup.cron=0 45 3 * * *
password-reset.cleanup.retention-days=2
rate-limit.forgot-password.ip.capacity=5
rate-limit.forgot-password.ip.period-seconds=900
rate-limit.forgot-password.ip-daily.capacity=10
rate-limit.forgot-password.ip-daily.period-seconds=86400
rate-limit.reset-password.ip.capacity=10
rate-limit.reset-password.ip.period-seconds=900
rate-limit.reset-password.email.capacity=10
rate-limit.reset-password.email.period-seconds=900

#---
spring.config.activate.on-profile=dev
# Dev-only secrets file; optional. Read as .properties: plain KEY=value, no quotes, no export.
spring.config.import=optional:file:.env[.properties]
