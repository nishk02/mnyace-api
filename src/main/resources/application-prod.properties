# --- Prod Profile ------------------------------------------
# JWT enforced on all endpoints except /auth/**

# CORS
cors.allowed-origins=capacitor://localhost,ionic://localhost,https://app.mnyace.com
# --- SQLite path -----------------------------------------------
# In dev, application.properties hardcodes jdbc:sqlite:mnyace.db - fine,
# it's a plain file next to wherever you run the jar. Inside the container
# that same relative path would resolve to Docker's writable-but-throwaway
# container layer, not the /app/data volume the Dockerfile prepares - so
# every redeploy would silently start from an empty database.
# DB_PATH defaults to the old relative filename so nothing changes for
# `mvn spring-boot:run`; docker-compose.yml sets DB_PATH=/app/data/mnyace.db
# for prod, which lands inside the mounted named volume instead.
spring.datasource.url=jdbc:sqlite:${DB_PATH:mnyace.db}

# Limit maximum number of users who can be invited
app.max-users=50

# Log no SQL in prod (base profile turns it on for local debugging)
spring.jpa.show-sql=false
