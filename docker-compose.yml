# Runs on the Lightsail VM. CI never builds here — it only pulls the image
# GitHub Actions already built and pushed to GHCR (see build policy: no
# local/VM builds, so amd64 vs arm64 never becomes a problem to juggle).
# Docker keeps container output forever by default; cap it so logs can never fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: ghcr.io/nishk02/mnyace-api:latest
    container_name: mnyace-api
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      DB_PATH: /app/data/mnyace.db
      SECURITY_LOG_FILE: /app/logs/security.log
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      INVITE_SIGNUP_URL: ${INVITE_SIGNUP_URL}
    volumes:
      # Named volume, not a bind mount - Docker manages the storage location,
      # and it survives `docker compose down` (only `-v` would remove it).
      # This is also exactly what Litestream will watch once that's wired up.
      - mnyace-data:/app/data
      # Security events, one JSON line each; a log shipper reads this read-only.
      - mnyace-logs:/app/logs
  caddy:
    image: caddy:2-alpine
    container_name: mnyace-caddy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  litestream:
    image: litestream/litestream:0.5.16
    container_name: mnyace-litestream
    restart: unless-stopped
    logging: *default-logging
    environment:
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY}
    volumes:
      - ./litestream.yml:/etc/litestream.yml
      - mnyace-data:/app/data
    command: replicate
    depends_on:
      - api

volumes:
  mnyace-data:
  mnyace-logs:
  caddy-data:
  caddy-config:
