# Runs on the Lightsail VM. CI never builds here — it only pulls the image
# GitHub Actions already built and pushed to GHCR (see build policy: no
# local/VM builds, so amd64 vs arm64 never becomes a problem to juggle).
# Docker keeps container output forever by default; cap it so logs can never fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: ghcr.io/nishk02/mnyace-api:latest
    container_name: mnyace-api
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 900m
    logging: *default-logging
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      DB_PATH: /app/data/mnyace.db
      SECURITY_LOG_FILE: /app/logs/security.log
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      INVITE_SIGNUP_URL: ${INVITE_SIGNUP_URL}
    volumes:
      # Named volume, not a bind mount - Docker manages the storage location,
      # and it survives `docker compose down` (only `-v` would remove it).
      # This is also exactly what Litestream will watch once that's wired up.
      - mnyace-data:/app/data
      # Security events, one JSON line each; a log shipper reads this read-only.
      - mnyace-logs:/app/logs
  caddy:
    image: caddy:2-alpine
    container_name: mnyace-caddy
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  litestream:
    image: litestream/litestream:0.5.16
    container_name: mnyace-litestream
    restart: unless-stopped
    # Runs as root on a volume owned by the api user: it must override file access and chown its state dir.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    logging: *default-logging
    environment:
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY}
    volumes:
      - ./litestream.yml:/etc/litestream.yml
      - mnyace-data:/app/data
    command: replicate
    depends_on:
      - api

  # Sends the security event log to Axiom. Read-only on the logs, no ports, tight limits.
  log-shipper:
    image: fluent/fluent-bit:5.1.3
    container_name: mnyace-log-shipper
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["/fluent-bit/bin/fluent-bit"]
    command: ["-c", "/fluent-bit/etc/fluent-bit.yaml"]
    environment:
      AXIOM_HOST: ${AXIOM_HOST}
      AXIOM_DATASET: ${AXIOM_DATASET}
      AXIOM_TOKEN: ${AXIOM_TOKEN}
    volumes:
      - ./fluent-bit:/fluent-bit/etc:ro
      - mnyace-logs:/var/log/mnyace:ro
      - mnyace-shipper-state:/var/lib/fluent-bit
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m

volumes:
  mnyace-data:
  mnyace-logs:
  mnyace-shipper-state:
  caddy-data:
  caddy-config:
